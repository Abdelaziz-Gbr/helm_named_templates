apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: nginx
    tier: {{ .Values.tier  }}
  name: nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nginx
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: nginx
        tier: {{ .Values.tier }}
    spec:
      containers:
        - image: {{ .Values.image.repository | default "library/nginx" | lower}}:{{ if .Values.image.isProduction  }}1.27-alpine{{ else  }}latest{{ end }}
          name: nginx
          resources: {{ include "myapp.containerResources" . | indent 12 }}
